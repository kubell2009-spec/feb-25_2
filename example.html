<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Challenge</title>

    <link rel="stylesheet" href="./shared.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: black;
        }

        /* Default layout: center everything */
        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            gap: 16px;
            box-sizing: border-box;
            padding: 24px;
        }

        /* Keep every result centered */
        #result {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Preserve the ASCII face's spacing */
        .ascii-face {
            white-space: pre;
            font-family: monospace;
            line-height: 1.2;
        }
    </style>
</head>

<body>
    <main class="page">
        <div id="password-area"></div>
        <div id="result"></div>
    </main>

    <script type="module">
        import {
            makeText,
            makeInput,
            makeButton,
            makePasswordCheck
        } from "./shared.js";

        const passwordArea = document.getElementById("password-area");
        const result = document.getElementById("result");

        // Create the shared password input
        const passwordInput = makeInput(
            "Enter password",
            "black",
            "password"
        );

        // Define what happens after checking the password
        const checkPassword = makePasswordCheck({
            input: passwordInput,
            correctPassword: "open-sesame",

            onCorrect: () => {
                result.replaceChildren();

                const smiley = makeText(
                    " .-\"\"\"-. \n" +
                    "/       \\\n" +
                    "|  o o  |\n" +
                    "|   ^   |\n" +
                    "| \\___/ |\n" +
                    " \\_____/",
                    "pre"
                );

                smiley.classList.add("ascii-face");
                result.append(smiley);
            },

            onIncorrect: () => {
                result.replaceChildren(
                    makeText("you got it wrong", "p")
                );
            }
        });

        // Create the shared button
        const submitButton = makeButton(
            "Submit",
            "black",
            checkPassword
        );

        passwordArea.append(passwordInput, submitButton);
    </script>
</body>
</html>
