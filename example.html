<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Challenge</title>

    <link rel="stylesheet" href="./shared.css">

   
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: black;
    }

    #password-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
    }

    #result {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .ascii-face {
        white-space: pre;
        font-family: monospace;
        line-height: 1.2;
    }
</style>

<main class="shared-page">
    <div id="password-area"></div>
    <div id="result"></div>
</main>

</head>

<body>
    <main class="page">
        <div id="password-area"></div>
        <div id="result"></div>
    </main>

    <script type="module">
        import {
            makeText,
            makeInput,
            makeButton,
            makePasswordCheck
        } from "./shared.js";

        const passwordArea = document.getElementById("password-area");
        const result = document.getElementById("result");

        // Create the shared password input
        const passwordInput = makeInput(
            "Enter password",
            "black",
            "password"
        );

        // Define what happens after checking the password
        const checkPassword = makePasswordCheck({
            input: passwordInput,
            correctPassword: "open-sesame",

            onCorrect: () => {
                result.replaceChildren();

                const smiley = makeText(
                    " .-\"\"\"-. \n" +
                    "/       \\\n" +
                    "|  o o  |\n" +
                    "|   ^   |\n" +
                    "| \\___/ |\n" +
                    " \\_____/",
                    "pre"
                );

                smiley.classList.add("ascii-face");
                result.append(smiley);
            },

            onIncorrect: () => {
                result.replaceChildren(
                    makeText("you got it wrong", "p")
                );
            }
        });

        // Create the shared button
        const submitButton = makeButton(
            "Submit",
            "black",
            checkPassword
        );

        passwordArea.append(passwordInput, submitButton);
    </script>
</body>
</html>
