<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Gateway</title>

    <link rel="stylesheet" href="./shared.css">

   
<style>
    body {
    margin: 0;
    min-height: 100vh;
    background: black;
    isolation: isolate;
    position: relative;
    }

    body::before {
        content: "";
        position: fixed;
        inset: -20%;
        z-index: -1;
        pointer-events: none;

        background:
            linear-gradient(white, white) 5% 10% / 280px 280px no-repeat,
            linear-gradient(white, white) 65% 15% / 360px 360px no-repeat,
            linear-gradient(white, white) 25% 75% / 320px 320px no-repeat,
            linear-gradient(white, white) 85% 80% / 260px 260px no-repeat,
            conic-gradient(
                white 25%,
                black 0 50%,
                white 0 75%,
                black 0
            ) 0 0 / 340px 340px;

        transform: rotate(-12deg) scale(1.1);
    }

    #password-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
    }

    #result {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .ascii-face {
        white-space: pre;
        font-family: monospace;
        line-height: 1.2;
    }
</style>

</head>

<body>
    <main class="shared-page">
        <div id="heading"></div>
        <div id="password-area"></div>
        <div id="result"></div>
    </main>

    <script type="module">
        import {
            makeText,
            makeInput,
            makeButton,
            makePasswordCheck,
            lineBreak
        } from "./shared.js";

        const passwordArea = document.getElementById("password-area");
        const heading = document.getElementById("heading");
        heading.append(makeText("Your story begins here.", "h1"));
        const result = document.getElementById("result");

        // Create the shared password input
        const passwordInput = makeInput(
            "Enter password",
            "text"
        );
        passwordInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                confirm.click();
            }
        });

        // Define what happens after checking the password
        const checkPassword = makePasswordCheck({
            input: passwordInput,
            correctPassword: "123456",

            onCorrect: () => {
                result.replaceChildren(makeText("you've won"));

    // Lock the controls
                passwordInput.disabled = true;
                submitButton.disabled = true;

    // Redirect after 3 seconds
                setTimeout(() => {
                    window.location.href = "https://www.youtube.com/";
                }, 3000);
            },

            onIncorrect: () => {
                result.replaceChildren(
                    makeText("you got it wrong")
                );
            }
        });

        // Create the shared button
        const submitButton = makeButton(
            "Submit",
            "black",
            checkPassword
        );

        passwordArea.append(passwordInput, submitButton);
    </script>
</body>
</html>
