<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Gateway</title>

    <link rel="stylesheet" href="./shared.css">

   
<style>
    body {
    margin: 0;
    min-height: 100vh;
    background: black;
    isolation: isolate;
    position: relative;
    }

body::before {
    content: "";
    position: fixed;
    inset: -10%;
    z-index: -1;
    pointer-events: none;
    background-color: black;

    background-image:
        linear-gradient(white, white),
        linear-gradient(white, white),
        linear-gradient(white, white),
        linear-gradient(white, white),
        linear-gradient(white, white),
        linear-gradient(white, white),
        linear-gradient(white, white),
        linear-gradient(white, white),
        linear-gradient(white, white);

    background-size:
        420px 280px,
        250px 390px,
        380px 300px,
        310px 420px,
        450px 260px,
        220px 220px,
        300px 340px,
        180px 260px,
        360px 180px;

    background-position:
        3% 8%,
        52% 3%,
        78% 35%,
        18% 62%,
        62% 75%,
        42% 38%,
        92% 83%,
        30% 18%,
        70% 58%;

    background-repeat: no-repeat;
    transform: rotate(-8deg) scale(1.15);
}
    #password-area {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
    }

    #result {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
    }

    .ascii-face {
        white-space: pre;
        font-family: monospace;
        line-height: 1.2;
    }
</style>

</head>

<body>
    <main class="shared-page">
        <div id="heading"></div>
        <div id="password-area"></div>
        <div id="result"></div>
    </main>

    <script type="module">
        import {
            makeText,
            makeInput,
            makeButton,
            makePasswordCheck,
            lineBreak
        } from "./shared.js";

        const passwordArea = document.getElementById("password-area");
        const heading = document.getElementById("heading");
        heading.append(makeText("Your story begins here.", "h1"));
        const result = document.getElementById("result");

        // Create the shared password input
        const passwordInput = makeInput(
            "Enter password",
            "text"
        );
        passwordInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                submitButton.click();
            }
        });

        // Define what happens after checking the password
        const checkPassword = makePasswordCheck({
            input: passwordInput,
            correctPassword: "123456",

            onCorrect: () => {
                result.replaceChildren(makeText("you've won"));

    // Lock the controls
                passwordInput.disabled = true;
                submitButton.disabled = true;

    // Redirect after 3 seconds
                setTimeout(() => {
                    window.location.href = "https://www.youtube.com/";
                }, 3000);
            },

            onIncorrect: () => {
                result.replaceChildren(
                    makeText("you got it wrong")
                );
            }
        });

        // Create the shared button
        const submitButton = makeButton(
            "Submit",
            checkPassword
        );

        passwordArea.append(passwordInput, submitButton);
    </script>
</body>
</html>
