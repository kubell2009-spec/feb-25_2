<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing</title>

    <link rel="stylesheet" href="./shared.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
        }

        .landing {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            text-align: center;
            background: linear-gradient(
                to right,
                black 50%,
                white 50%
            );
        }
    </style>
</head>
<body>
    <main class="landing" id="landing"></main>

    <script type="module">
        import {
            makeText,
            makeButton
        } from "./shared.js";

        const landing = document.getElementById("landing");
        const buttons = document.createElement("div");
        
        buttons.style.display = "flex";
        buttons.style.justifyContent = "center";
        buttons.style.gap = "12px";

        buttons.append(
            makeButton("Sun", "black", () => {
                window.location.href = "./solarstream.html";
            }),

            makeButton("Moon", "black", () => {
                window.location.href = "./lunardroplets.html";
            })
        );    
        
        landing.append(
            makeText("Welcome", "h1"),
            makeText("Click below to enter.", "p"),
            buttons
        );
    </script>
</body>
</html>
