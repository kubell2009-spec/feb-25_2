<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equinox</title>

    <link rel="stylesheet" href="./shared.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
        }

        .landing {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            text-align: center;
            background: linear-gradient(
                to right,
                white 50%,
                black 50%
            );
        }
    </style>
</head>
<body>
    <main class="landing" id="landing"></main>

    <script type="module">
        import {
            makeText,
            makeButton
        } from "./shared.js";

        const landing = document.getElementById("landing");

        // Create the row for the two buttons and input
        const controls = document.createElement("div");

        controls.style.display = "flex";
        controls.style.alignItems = "center";
        controls.style.justifyContent = "center";
        controls.style.gap = "12px";

        // Create the input box
        const password = makeInput("Enter password", "password");

        // Create the Confirm Password button
        const confirm = makeButton("Confirm Password", () => {
            if (password.value === "your-password") {
                window.location.href = "./solarstream.html";
            } else {
                alert("Incorrect password");
            }
        });

        // Create the Sun and Moon buttons
        controls.append(
            makeButton("Sun", () => {
                window.location.href = "./solarstream.html";
            }),

            password,

            makeButton("Moon", () => {
                window.location.href = "./lunardroplets.html";
            })
        );

        // Create a container for the row and confirmation button
        const passwordBox = document.createElement("div");

        passwordBox.style.display = "flex";
        passwordBox.style.flexDirection = "column";
        passwordBox.style.alignItems = "center";
        passwordBox.style.gap = "16px";

        passwordBox.append(controls, confirm);

        // Add everything to the page
        landing.append(
            makeText("Welcome", "h1"),
            makeText("Click below to enter.", "p"),
            passwordBox
        );
    </script>
</body>
</html>
