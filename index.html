<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equinox</title>

    <link rel="stylesheet" href="./shared.css">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
        }

        .landing {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            text-align: center;
            background: linear-gradient(
                to right,
                white 50%,
                black 50%
            );
        }
    </style>
</head>
<body>
    <main class="landing" id="landing"></main>

    <script type="module">
        import {
            makeText,
            makeButton,
            makeInput,
            lineBreak
        } from "./shared.js";

     
        const landing = document.getElementById("landing");

        // Create the input
        const password = makeInput("Enter password", "text");
        password.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                confirm.click();
            }
        });

        // Create the row: Sun | Password | Moon
        const controls = document.createElement("div");
        controls.style.display = "flex";
        controls.style.alignItems = "center";
        controls.style.justifyContent = "center";
        controls.style.gap = "12px";

        const sunButton = makeButton("Solar Fragments", () => {
            window.location.href = "./solarstream.html";
        });

        const moonButton = makeButton("Lunar Fragments", () => {
            window.location.href = "./lunardroplets.html";
        });

        controls.append(sunButton, password, moonButton);

        // Create the result message
        const result = makeText("", "p");

        // Track whether the user has won
        let won = false;

        // Create the confirmation button
        const correcttext = makeText("A new celestial body emerges.");
        correcttext.append(
            lineBreak(),
            makeText("Redirecting in 3s...")
        );
        const confirm = makeButton("Piece them together", () => {
         // Prevent another attempt after winning
            if (won) return;

            if (password.value === "your-password") {
                won = true;
                result.replaceChildren(correcttext);

        // Lock all controls
                password.disabled = true;
                sunButton.disabled = true;
                moonButton.disabled = true;
                confirm.disabled = true;

        // Redirect after 3 seconds
                setTimeout(() => {
                    window.location.href = "./eclipse.html";
                }, 3000);
            } else {
                result.textContent = "you've failed";
            }
        });

        // Stack everything vertically
        const passwordBox = document.createElement("div");
        passwordBox.style.display = "flex";
        passwordBox.style.flexDirection = "column";
        passwordBox.style.alignItems = "center";
        passwordBox.style.gap = "16px";

        passwordBox.append(controls, confirm, result);

        // Add everything to the page
        const headering = makeText("in Harmonizing a Contrast", "h1");
        const description = makeText("Recover the fragments of the Sun and the Moon,");
        description.append(
            lineBreak(),
            "and piece them together where day transitions into night."
        )
        
        landing.append(
            headering,
            description,
            passwordBox
        );

    </script>
</body>
</html>
